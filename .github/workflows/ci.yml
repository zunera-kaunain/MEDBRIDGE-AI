name: CI

# Runs on every push and pull request: type-check + build the frontend and
# run the backend tests. The tests use an in-memory fake database, so no
# secrets or MongoDB connection are needed.

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The CUDA wheels need a GPU machine and are not needed for the tests.
      - run: grep -v "^nvidia-" requirements.txt > requirements.ci.txt
      - run: pip install -r requirements.ci.txt
      - run: python -m pytest -q
        env:
          USE_MOCK: "true"
